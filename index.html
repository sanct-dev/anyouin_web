<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="images/logo/安養院シンボル.svg">
<title>安養院 ウェブサイト方向性モックアップ</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Shippori Mincho', serif;
    background: #F7F4F0;
    color: #1a1a18;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 24px;
  }
  header {
    text-align: center;
    margin-bottom: 56px;
  }
  .site-label {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: #8e1a1a;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 0.25em;
    font-weight: 400;
    line-height: 1.8;
    color: #1a1a18;
  }
  .desc {
    margin-top: 16px;
    font-size: 13px;
    letter-spacing: 0.1em;
    color: #6a6a68;
    line-height: 2;
  }

  .section {
    width: 100%;
    max-width: 960px;
    margin-bottom: 48px;
  }
  .section-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid #dedad4;
  }
  .section-num {
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: #8e1a1a;
  }
  .section-title {
    font-size: 15px;
    letter-spacing: 0.2em;
    font-weight: 500;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .card {
    display: flex;
    flex-direction: column;
    background: #fff;
    border: 1px solid #dedad4;
    border-radius: 4px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
  }
  .card:hover {
    border-color: #8e1a1a;
    box-shadow: 0 4px 18px rgba(142,26,26,0.12);
    transform: translateY(-2px);
  }

  /* サムネイル（各ページをiframeで縮小表示） */
  .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: #fff;
    border-bottom: 1px solid #ece8e2;
  }
  .thumb iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 800px;
    border: 0;
    transform-origin: top left;
    pointer-events: none;
  }
  /* iframeが読めない時のフォールバックの薄い下地 */
  .thumb::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(45deg, #faf9f7, #faf9f7 8px, #f3f0eb 8px, #f3f0eb 16px);
    z-index: -1;
  }

  .card-meta {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 12px 16px;
  }
  .card-label {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: #8e1a1a;
    min-width: 18px;
  }
  .card-title {
    font-size: 13px;
    letter-spacing: 0.12em;
    line-height: 1.5;
  }
  .card-tag {
    display: inline-block;
    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: #8e1a1a;
    border: 1px solid #c88;
    border-radius: 2px;
    padding: 1px 5px;
    margin-left: 8px;
    vertical-align: middle;
    opacity: 0.7;
  }

  .card.omake .thumb { filter: grayscale(0.15); }
  .card.omake .card-label { color: #aaa; }
  .card.omake .card-tag { color: #aaa; border-color: #ccc; }

  .wireframe-section {
    width: 100%;
    max-width: 960px;
    margin-bottom: 48px;
  }
  .wireframe-header {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: #aaa;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px dashed #dedad4;
  }

  footer {
    margin-top: 16px;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #aaa;
  }
</style>
</head>
<body>

<header>
  <p class="site-label">ANYOIN — MOCKUP COMPARISON</p>
  <h1>安養院 ウェブサイト<br>方向性モックアップ</h1>
  <p class="desc">各案を開いて、印象を比べてみてください。</p>
</header>

<!-- 01 端正でアクセスしやすい -->
<div class="section">
  <div class="section-header">
    <span class="section-num">01</span>
    <span class="section-title">端正でアクセスしやすい</span>
  </div>
  <div class="cards">
    <a class="card" href="html/mockup_01_太宰府天満宮方向_photo.html">
      <div class="thumb"><iframe src="html/mockup_01_太宰府天満宮方向_photo.html" scrolling="no" loading="lazy"></iframe></div>
      <div class="card-meta">
        <span class="card-label">A</span>
        <span class="card-title">写真入り</span>
      </div>
    </a>
    <a class="card" href="html/main01.html">
      <div class="thumb"><iframe src="html/main01.html" scrolling="no" loading="lazy"></iframe></div>
      <div class="card-meta">
        <span class="card-label">B</span>
        <span class="card-title">お知らせメイン</span>
      </div>
    </a>
    <a class="card" href="html/main01_red.html">
      <div class="thumb"><iframe src="html/main01_red.html" scrolling="no" loading="lazy"></iframe></div>
      <div class="card-meta">
        <span class="card-label">C</span>
        <span class="card-title">お知らせメイン_画像大</span>

<!-- 02 親しみやすい -->
<div class="section">
  <div class="section-header">
    <span class="section-num">02</span>
    <span class="section-title">親しみやすい</span>
  </div>
  <div class="cards">
    <a class="card" href="main02/main02.html">
      <div class="thumb"><iframe src="main02/main02.html" scrolling="no" loading="lazy"></iframe></div>
      <div class="card-meta">
        <span class="card-label">A</span>
        <span class="card-title">main<span class="card-tag">制作中</span></span>
      </div>
    </a>
    <a class="card" href="html/main02_texture01.html">
      <div class="thumb"><iframe src="html/main02_texture01.html" scrolling="no" loading="lazy"></iframe></div>
      <div class="card-meta">
        <span class="card-label">B</span>
        <span class="card-title">main_画用紙<span class="card-tag">制作中</span></span>
      </div>
    </a>
  </div>
</div>

<footer>© 安養院 真福寺　制作用内部資料</footer>

<script>
  // 各サムネのiframe（論理幅1280px）を、カード幅に合わせて縮小表示する
  const IFRAME_W = 1280;
  function fitThumbs() {
    document.querySelectorAll('.thumb').forEach(function (t) {
      const f = t.querySelector('iframe');
      if (!f) return;
      const scale = t.clientWidth / IFRAME_W;
      f.style.transform = 'scale(' + scale + ')';
    });
  }
  window.addEventListener('load', fitThumbs);
  window.addEventListener('resize', fitThumbs);
  // フォント・レイアウト確定後のズレ対策で一度遅延再計算
  setTimeout(fitThumbs, 300);
</script>

</body>
</html>
